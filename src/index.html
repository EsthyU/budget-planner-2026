<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Atelier" />
<meta name="theme-color" content="#0d1424" />
<title>Atelier</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1424'/%3E%3Ctext x='90' y='118' font-family='serif' font-size='100' font-style='italic' text-anchor='middle' fill='%23ff8a65'%3EA%3C/text%3E%3C/svg%3E" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0d1424;
  --bg-elev: #141d33;
  --bg-card: #1a2540;
  --line: rgba(255, 244, 230, 0.08);
  --line-strong: rgba(255, 244, 230, 0.18);
  --coral: #ff8a65;
  --coral-bright: #ffa489;
  --coral-deep: #e85d39;
  --copper: #d4915a;
  --bone: #f5ebd6;
  --ink: #f0e8d8;
  --ink-muted: #8a93a8;
  --ink-faint: #4d5470;
  --career: #ff8a65;
  --personal: #c084b7;
  --spiritual: #7fb0c8;
  --health: #8fc0a0;
  --career-deep: #e85d39;
  --personal-deep: #9c5e94;
  --spiritual-deep: #4f88a8;
  --health-deep: #5a9474;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
input, textarea {
  font: inherit; outline: none;
  background: rgba(255, 244, 230, 0.04); color: var(--ink);
  border: 1px solid var(--line-strong);
  padding: 14px 16px; width: 100%;
  font-size: 15px;
  border-radius: 4px;
}
input:focus, textarea:focus { border-color: var(--coral); }
input::placeholder { color: var(--ink-faint); }
input[type="time"]::-webkit-calendar-picker-indicator {
  filter: invert(70%) sepia(70%) saturate(450%) hue-rotate(330deg) brightness(100%);
  opacity: 0.7;
}

.serif { font-family: 'Fraunces', serif; }
.italic { font-style: italic; }
.mono { font-family: 'JetBrains Mono', monospace; }
.app { max-width: 448px; margin: 0 auto; padding-bottom: 110px; position: relative; min-height: 100vh; }

/* Backdrop pattern */
.backdrop {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 600px 400px at 90% 0%, rgba(255, 138, 101, 0.08), transparent 70%),
    radial-gradient(ellipse 500px 600px at 10% 100%, rgba(192, 132, 183, 0.05), transparent 70%);
}
.content { position: relative; z-index: 1; }

@keyframes fadeUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
.fade-up { animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.fade-in { animation: fadeIn 0.4s ease-out; }
.slide-down { animation: slideDown 0.4s ease-out; }
.stagger > * { opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.stagger > *:nth-child(1) { animation-delay: 0.04s; }
.stagger > *:nth-child(2) { animation-delay: 0.1s; }
.stagger > *:nth-child(3) { animation-delay: 0.16s; }
.stagger > *:nth-child(4) { animation-delay: 0.22s; }
.stagger > *:nth-child(5) { animation-delay: 0.28s; }

/* ============ HOME — magazine collage ============ */
.home-header {
  padding: 56px 20px 24px;
  position: relative;
}
.home-issue {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--ink-muted);
  display: flex; justify-content: space-between; align-items: center;
}
.home-issue-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); animation: pulse 2.5s infinite; }

.masthead {
  margin-top: 40px;
  text-align: center;
  position: relative;
}
.masthead-pre {
  font-family: 'Fraunces', serif; font-style: italic;
  color: var(--coral); font-size: 18px;
  letter-spacing: 0.05em;
}
.masthead-title {
  font-family: 'Fraunces', serif;
  font-weight: 600; font-size: 84px; line-height: 0.9;
  color: var(--bone); letter-spacing: -0.04em;
  margin-top: 4px;
}
.masthead-title .accent { color: var(--coral); font-style: italic; font-weight: 400; }
.masthead-rule {
  display: flex; align-items: center; gap: 12px;
  margin: 24px auto 0; max-width: 240px;
}
.masthead-rule-line { flex: 1; height: 1px; background: var(--line-strong); }
.masthead-rule-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
  color: var(--ink-muted);
}

/* Today readout */
.today-block {
  margin: 36px 20px 0;
  padding: 24px;
  background: linear-gradient(135deg, rgba(255, 138, 101, 0.05), rgba(255, 138, 101, 0.01));
  border: 1px solid var(--line);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}
.today-block::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(255, 138, 101, 0.15), transparent 70%);
}
.today-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; position: relative;
}
.today-left {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--ink-muted);
}
.today-num {
  font-family: 'Fraunces', serif; font-style: italic;
  font-weight: 400; font-size: 84px; line-height: 0.85;
  color: var(--coral); margin-top: 6px; letter-spacing: -0.04em;
}
.today-num small { font-size: 24px; color: var(--coral); opacity: 0.6; }
.today-right { text-align: right; flex: 1; }
.today-caption {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 17px; color: var(--ink); line-height: 1.3;
}
.today-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted); margin-top: 8px;
}

/* Section collage — asymmetric grid */
.collage-heading {
  padding: 56px 20px 0;
}
.collage-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--coral);
}
.collage-title {
  font-family: 'Fraunces', serif; font-weight: 600;
  font-size: 38px; color: var(--bone); margin-top: 8px;
  line-height: 0.95; letter-spacing: -0.02em;
}
.collage-title .italic { color: var(--coral); font-weight: 400; }

.collage-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 12px; padding: 24px 20px 0;
}
.deck {
  border-radius: 12px; padding: 18px;
  text-align: left; position: relative; overflow: hidden;
  transition: transform 0.2s;
  background: var(--bg-card);
  border: 1px solid;
  display: flex; flex-direction: column;
}
.deck:active { transform: scale(0.97); }
/* Asymmetric placements */
.deck-1 { grid-column: span 2; grid-row: span 2; min-height: 220px; }
.deck-2 { grid-column: span 1; grid-row: span 1; min-height: 104px; }
.deck-3 { grid-column: span 1; grid-row: span 1; min-height: 104px; }
.deck-4 { grid-column: span 3; grid-row: span 1; min-height: 100px; }

.deck-glow {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.18;
}
.deck-glow-1 { background: radial-gradient(circle at 80% 20%, currentColor, transparent 60%); }
.deck-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em;
  color: currentColor; opacity: 0.7;
  position: relative; z-index: 1;
}
.deck-symbol {
  width: 36px; height: 36px;
  background: rgba(255, 244, 230, 0.06);
  border: 1px solid;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: currentColor;
  margin-top: auto;
  position: relative; z-index: 1;
}
.deck-1 .deck-symbol { width: 56px; height: 56px; margin-bottom: 12px; }
.deck-name {
  font-family: 'Fraunces', serif;
  font-weight: 600; font-size: 18px;
  color: var(--ink); margin-top: 8px; line-height: 1.1;
  position: relative; z-index: 1;
}
.deck-1 .deck-name { font-size: 28px; font-weight: 600; }
.deck-pct {
  font-family: 'Fraunces', serif; font-style: italic;
  font-weight: 400; color: currentColor;
  position: absolute; top: 16px; right: 18px;
  font-size: 28px; line-height: 1;
}
.deck-1 .deck-pct { font-size: 44px; }
.deck-2 .deck-pct, .deck-3 .deck-pct { font-size: 22px; }
.deck-pct small { font-size: 50%; opacity: 0.7; }
.deck-foot {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-muted); margin-top: 8px;
  position: relative; z-index: 1;
}

/* Deck colors */
.deck-career { border-color: rgba(255, 138, 101, 0.4); color: var(--career); }
.deck-career .deck-glow { color: var(--career); }
.deck-personal { border-color: rgba(192, 132, 183, 0.4); color: var(--personal); }
.deck-personal .deck-glow { color: var(--personal); }
.deck-spiritual { border-color: rgba(127, 176, 200, 0.4); color: var(--spiritual); }
.deck-spiritual .deck-glow { color: var(--spiritual); }
.deck-health { border-color: rgba(143, 192, 160, 0.4); color: var(--health); }
.deck-health .deck-glow { color: var(--health); }

/* Section summary as quote in deck-1 */
.deck-1-summary {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 13px; color: var(--ink-muted);
  margin-top: 8px; line-height: 1.4;
  position: relative; z-index: 1;
}

/* Upcoming */
.upcoming-section { padding: 48px 20px 0; }
.upcoming-head {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 16px;
}
.upcoming-title {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 28px; color: var(--bone);
}
.upcoming-count {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--coral); letter-spacing: 0.2em;
}
.upcoming-item {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.upcoming-time-block {
  font-family: 'Fraunces', serif; font-style: italic;
  color: var(--coral); font-size: 22px;
  min-width: 64px; line-height: 1;
}
.upcoming-text-block { flex: 1; min-width: 0; }
.upcoming-text {
  font-size: 14px; color: var(--ink);
  font-weight: 500;
}
.upcoming-sec-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted); margin-top: 4px;
}

/* ============ SECTION VIEW — colored deck immersion ============ */
.sec-hero {
  position: relative; padding: 20px 20px 0;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--ink-muted);
}
.back-btn:hover { color: var(--coral); }

.sec-banner {
  margin: 16px 20px 0;
  padding: 32px 24px;
  border-radius: 16px;
  border: 1px solid;
  position: relative;
  overflow: hidden;
}
.sec-banner-bg {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.15;
}
.sec-banner-bg-1 { background: radial-gradient(circle at 100% 0%, currentColor, transparent 50%); }
.sec-banner-bg-2 { background: radial-gradient(circle at 0% 100%, currentColor, transparent 50%); }

.sec-banner.career { border-color: rgba(255, 138, 101, 0.3); color: var(--career); background: linear-gradient(135deg, rgba(255, 138, 101, 0.08), rgba(255, 138, 101, 0.01)); }
.sec-banner.personal { border-color: rgba(192, 132, 183, 0.3); color: var(--personal); background: linear-gradient(135deg, rgba(192, 132, 183, 0.08), rgba(192, 132, 183, 0.01)); }
.sec-banner.spiritual { border-color: rgba(127, 176, 200, 0.3); color: var(--spiritual); background: linear-gradient(135deg, rgba(127, 176, 200, 0.08), rgba(127, 176, 200, 0.01)); }
.sec-banner.health { border-color: rgba(143, 192, 160, 0.3); color: var(--health); background: linear-gradient(135deg, rgba(143, 192, 160, 0.08), rgba(143, 192, 160, 0.01)); }

.sec-banner-top {
  display: flex; align-items: center; gap: 16px;
  position: relative; z-index: 1;
}
.sec-emblem {
  width: 56px; height: 56px;
  border: 1px solid currentColor;
  background: rgba(255, 244, 230, 0.04);
  display: flex; align-items: center; justify-content: center;
  color: currentColor; border-radius: 12px;
  flex-shrink: 0;
}
.sec-emblem-meta {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: currentColor; opacity: 0.8;
}
.sec-banner-title {
  font-family: 'Fraunces', serif; font-weight: 600;
  font-size: 36px; color: var(--bone); line-height: 1;
  margin-top: 4px; letter-spacing: -0.02em;
}
.sec-banner-summary {
  font-family: 'Fraunces', serif; font-style: italic;
  color: var(--ink-muted); font-size: 16px;
  margin-top: 16px; line-height: 1.5;
  position: relative; z-index: 1;
}

.sec-stats {
  display: flex; gap: 12px;
  margin: 20px 20px 0;
}
.sec-stat-card {
  flex: 1; padding: 16px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: left;
}
.sec-stat-num {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 28px; line-height: 1;
  color: var(--coral);
}
.sec-stat-num small { font-size: 12px; color: var(--coral); opacity: 0.6; }
.sec-stat-key {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted); margin-top: 6px;
}

/* Tabs — pill style */
.pill-tabs {
  display: flex; gap: 6px;
  margin: 24px 20px 0;
  padding: 4px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.pill {
  flex: 1; padding: 12px 0;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted);
  border-radius: 999px;
  transition: all 0.2s;
}
.pill.active {
  background: var(--coral);
  color: var(--bg);
  font-weight: 600;
}

/* List actions */
.list-actions {
  display: flex; gap: 8px;
  margin: 20px 20px 16px;
}
.btn-line {
  flex: 1; padding: 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink); font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(255, 244, 230, 0.02);
}
.btn-line:hover { border-color: var(--coral); color: var(--coral); }
.btn-coral {
  flex: 1; padding: 12px;
  background: var(--coral);
  color: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(255, 138, 101, 0.3);
}

.list-info {
  margin: 0 20px 16px;
  padding: 10px 14px;
  background: rgba(255, 138, 101, 0.06);
  border: 1px solid rgba(255, 138, 101, 0.2);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--coral);
  display: flex; align-items: center; gap: 8px;
}

.empty-state {
  margin: 0 20px;
  padding: 36px 20px;
  text-align: center;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
}
.empty-quote {
  font-family: 'Fraunces', serif; font-style: italic;
  color: var(--ink-muted); font-size: 18px; line-height: 1.4;
}
.empty-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-faint); margin-top: 12px;
}

/* Task cards (Habitica-inspired with colored left bar) */
.task-list { padding: 0 20px; }
.task-card {
  display: flex; align-items: stretch;
  background: var(--bg-card);
  border-radius: 10px;
  margin-bottom: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.task-card.done { opacity: 0.45; }
@keyframes justAddedPulse {
  0% { border-color: var(--coral); box-shadow: 0 0 0 0 rgba(255, 138, 101, 0.5); background: rgba(255, 138, 101, 0.12); }
  100% { border-color: var(--line); box-shadow: 0 0 0 8px rgba(255, 138, 101, 0); background: var(--bg-card); }
}
.task-card.just-added {
  animation: justAddedPulse 1.6s ease-out;
}
.task-bar {
  width: 4px;
  background: var(--coral);
  flex-shrink: 0;
}
.task-card.done .task-bar { background: var(--ink-faint); }
.task-body-wrap {
  flex: 1; padding: 14px 14px 14px 12px;
  display: flex; align-items: center; gap: 12px;
}
.checkbox {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.checkbox.done {
  background: var(--coral); border-color: var(--coral);
  color: var(--bg);
}
.task-content { flex: 1; min-width: 0; }
.task-text { font-size: 14px; color: var(--ink); line-height: 1.3; }
.task-card.done .task-text { text-decoration: line-through; color: var(--ink-muted); }
.task-time {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--coral); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.task-delete {
  color: var(--ink-faint); padding: 6px;
  flex-shrink: 0;
}
.task-delete:hover { color: var(--coral); }

/* Habit cards */
.habit-list { padding: 0 20px; }
.habit-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.habit-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--coral);
}
.habit-card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; margin-bottom: 16px;
}
.habit-title {
  font-family: 'Fraunces', serif; font-weight: 600;
  font-size: 20px; color: var(--ink); flex: 1;
  line-height: 1.2;
}
.habit-stats {
  display: flex; gap: 16px;
  margin-bottom: 16px;
}
.habit-stat {
  display: flex; flex-direction: column;
}
.habit-stat-val {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 20px; color: var(--coral); line-height: 1;
}
.habit-stat-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted); margin-top: 4px;
}

/* Calendar grid for habit */
.habit-cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.habit-cal-period {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-muted);
}
.habit-cal-nav { display: flex; gap: 4px; }
.cal-nav-btn {

  templates: storedTemplates === null ? defaultTemplates : storedTemplates,

  habitLog: safeGet('habitLog-v2', {}),
  modal: null,
  modalEditId: null,
  reminders: [],
  habitWeekOffset: 0,
  justAdded: [],
};

// Safety net: ensure every section key exists as an array (prevents crashes if storage was partial)
Object.keys(SECTIONS).forEach(k => {
  if (!Array.isArray(state.templates[k])) state.templates[k] = [];
  if (!Array.isArray(state.habits[k])) state.habits[k] = [];
});

// If a section is empty AND has never been touched (no record exists), seed it from defaults.
// This recovers from any past bug that wiped a section, without overwriting an intentionally-emptied one.
const touchedKey = 'atelier-touched-v1';
let touched = safeGet(touchedKey, {});
Object.keys(SECTIONS).forEach(k => {
  if (state.templates[k].length === 0 && !touched['t-' + k]) {
    state.templates[k] = defaultTemplates[k];
  }
  if (state.habits[k].length === 0 && !touched['h-' + k]) {
    state.habits[k] = defaultHabits[k];
  }
});

function markTouched(kind, sec) {
  const t = safeGet(touchedKey, {});
  t[kind + '-' + sec] = true;
  safeSet(touchedKey, t);
}

function save() {
  safeSet('tasks-v2', state.tasks);
  safeSet('templates-v4', state.templates);
  safeSet('habits-v4', state.habits);
  safeSet('habitLog-v2', state.habitLog);
}

// ============== DATA ==============
function getTodayTasks(s) { const t = state.tasks[todayKey()]; return (t && t[s]) || []; }
function getSectionPct(s) {
  const t = getTodayTasks(s);
  if (t.length === 0) return 0;
  return Math.round(t.filter(x => x.done).length / t.length * 100);
}
function getOverallPct() {
  const all = Object.keys(SECTIONS).flatMap(s => getTodayTasks(s));
  if (all.length === 0) return 0;
  return Math.round(all.filter(t => t.done).length / all.length * 100);
}
function getStreak(id) {
  const log = state.habitLog[id] || {};
  let s = 0;
  // Walk backwards from today, one calendar day at a time, comparing by date string.
  let d = new Date();
  d.setHours(12, 0, 0, 0); // noon avoids any DST/timezone edge cases
  const todayStr = todayKey();
  while (true) {
    const k = dateKey(d);
    if (k < APP_START_DATE) break; // never count before the start date
    if (log[k]) {
      s++;
      d.setDate(d.getDate() - 1);
    } else {
      // Allow today to be unchecked without breaking the streak (day isn't over yet)
      if (k === todayStr) {
        d.setDate(d.getDate() - 1);
        continue;
      }
      break;
    }
  }
  return s;
}
function getTotalDays(id) {
  const log = state.habitLog[id] || {};
  return Object.keys(log).filter(k => log[k]).length;
}
function getWeekDays(offset) {
  offset = offset || 0;
  const days = [];
  const end = new Date();
  end.setDate(end.getDate() + (offset * 7));
  for (let i = 6; i >= 0; i--) {
    const d = new Date(end);
    d.setDate(end.getDate() - i);
    days.push(d);
  }
  return days;
}
function getWeekChart() {
  return getWeekDays(0).map(d => {
    const k = dateKey(d);
    const dt = state.tasks[k] || {};
    const all = Object.values(dt).flat();
    return { date: d, pct: all.length === 0 ? 0 : Math.round(all.filter(t => t.done).length / all.length * 100) };
  });
}

// ============== ACTIONS ==============
function addTask(text, time) {
  if (!text.trim()) return;
  const today = todayKey();
  if (!state.tasks[today]) state.tasks[today] = {};
  if (!state.tasks[today][state.activeSection]) state.tasks[today][state.activeSection] = [];
  state.tasks[today][state.activeSection].push({
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    text: text.trim(), time: time || null, done: false, reminded: false
  });
  save(); render();
}
function toggleTask(id) {
  const today = todayKey();
  if (!state.tasks[today] || !state.tasks[today][state.activeSection]) return;
  state.tasks[today][state.activeSection] = state.tasks[today][state.activeSection].map(t =>
    t.id === id ? Object.assign({}, t, { done: !t.done }) : t
  );
  save(); render();
  setTimeout(() => {
    const td = todayKey();
    if (state.tasks[td] && state.tasks[td][state.activeSection]) {
      const before = state.tasks[td][state.activeSection].length;
      state.tasks[td][state.activeSection] = state.tasks[td][state.activeSection].filter(t => !t.done);
      if (state.tasks[td][state.activeSection].length < before) {
        save();
        if (state.view === 'section' || state.view === 'home') render();
      }
    }
  }, 2000);
}
function deleteTask(id) {
  const today = todayKey();
  if (!state.tasks[today] || !state.tasks[today][state.activeSection]) return;
  state.tasks[today][state.activeSection] = state.tasks[today][state.activeSection].filter(t => t.id !== id);
  save(); render();
}
function addTemplate(text, time) {
  if (!text.trim()) return;
  state.templates[state.activeSection].push({
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    text: text.trim(), time: time || null
  });
  save(); render();
}
function deleteTemplate(id) {
  state.templates[state.activeSection] = state.templates[state.activeSection].filter(t => t.id !== id);
  markTouched('t', state.activeSection);
  save(); render();
}
function editTemplate(id, text, time) {
  if (!text.trim()) return;
  state.templates[state.activeSection] = state.templates[state.activeSection].map(t =>
    t.id === id ? Object.assign({}, t, { text: text.trim(), time: time || '', sample: false }) : t
  );
  save(); render();
}
function addTemplateToToday(id) {
  const tpl = state.templates[state.activeSection].find(t => t.id === id);
  if (!tpl) return;
  const today = todayKey();
  if (!state.tasks[today]) state.tasks[today] = {};
  if (!state.tasks[today][state.activeSection]) state.tasks[today][state.activeSection] = [];
  const newId = Date.now() + '_' + Math.random().toString(36).slice(2);
  state.tasks[today][state.activeSection].push({
    id: newId, text: tpl.text, time: tpl.time || null, done: false, reminded: false
  });
  // Close the modal, return to the Daily Tasks tab, and flag the new task to highlight
  state.modal = null;
  state.sectionTab = 'tasks';
  state.justAdded = [newId];
  save(); render();
  // Remove the highlight after a moment
  setTimeout(() => { state.justAdded = []; if (state.view === 'section') render(); }, 1800);
}
function loadAllTemplates() {
  const today = todayKey();
  if (!state.tasks[today]) state.tasks[today] = {};
  if (!state.tasks[today][state.activeSection]) state.tasks[today][state.activeSection] = [];
  const existing = new Set(state.tasks[today][state.activeSection].map(t => t.text));
  state.templates[state.activeSection].forEach(tmpl => {
    if (!existing.has(tmpl.text)) state.tasks[today][state.activeSection].push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2),
      text: tmpl.text, time: tmpl.time, done: false, reminded: false
    });
  });
  save(); state.modal = null; render();
}
function addHabit(text) {
  if (!text.trim()) return;
  state.habits[state.activeSection].push({
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    text: text.trim()
  });
  save(); render();
}
function deleteHabit(id) {
  state.habits[state.activeSection] = state.habits[state.activeSection].filter(h => h.id !== id);
  delete state.habitLog[id];
  markTouched('h', state.activeSection);
  save(); render();
}
function editHabit(id, text) {
  if (!text.trim()) return;
  state.habits[state.activeSection] = state.habits[state.activeSection].map(h =>
    h.id === id ? Object.assign({}, h, { text: text.trim(), sample: false }) : h
  );
  save(); render();
}
function toggleHabit(id, k) {
  if (k < APP_START_DATE) return;
  if (k > todayKey()) return;
  if (!state.habitLog[id]) state.habitLog[id] = {};
  if (state.habitLog[id][k]) delete state.habitLog[id][k];
  else state.habitLog[id][k] = true;
  save(); render();
}

// ============== HELPERS ==============
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtDate(d, fmt) {
  if (fmt === 'short') return d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
  if (fmt === 'full') return d.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });
  if (fmt === 'wd') return d.toLocaleDateString('en', { weekday: 'short' }).slice(0, 3).toUpperCase();
  return d.toLocaleDateString();
}
function getGreeting() {
  const h = new Date().getHours();
  if (h < 5) return 'In the small hours';
  if (h < 12) return 'A new morning';
  if (h < 17) return 'The afternoon unfolds';
  if (h < 21) return 'Evening settles';
  return 'The night arrives';
}

    html += '<div class="cb-num">' + d.pct + '</div>';
    html += '<div class="cb-wrap"><div class="cb-bar ' + (isToday ? 'today' : '') + '" style="height:' + h + '%"></div></div>';
    html += '<div class="cb-day ' + (isToday ? 'today' : '') + '">' + fmtDate(d.date, 'wd') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';

  Object.entries(SECTIONS).forEach(([key, sec]) => {
    const pct = getSectionPct(key);
    const sh = state.habits[key] || [];
    const totalStreak = sh.reduce((s, h) => s + getStreak(h.id), 0);
    const weekDays = getWeekDays(0);
    const sectionWeek = weekDays.map(d => {
      const k = dateKey(d);
      const dt = (state.tasks[k] && state.tasks[k][key]) || [];
      return dt.length === 0 ? 0 : Math.round(dt.filter(t => t.done).length / dt.length * 100);
    });
    const accent = 'var(--' + sec.cls + ')';

    html += '<div class="progress-sec" onclick="goSection(\'' + key + '\')">';
    html += '<div class="progress-sec-top">';
    html += '<div class="progress-sec-left">';
    html += '<div class="progress-sec-emblem" style="color:' + accent + '; border-color:' + accent + ';">' + svgIc(sec.icon, 16) + '</div>';
    html += '<div>';
    html += '<div class="progress-sec-name">' + sec.name + '</div>';
    html += '<div class="progress-sec-meta">' + sh.length + ' habits &middot; ' + totalStreak + ' streak days</div>';
    html += '</div></div>';
    html += '<div class="progress-sec-pct" style="color:' + accent + ';">' + pct + '<small>%</small></div>';
    html += '</div>';
    html += '<div class="progress-sec-bars">';
    sectionWeek.forEach((p, i) => {
      const isT = i === sectionWeek.length - 1;
      const hh = Math.max(p, 3);
      html += '<div class="psb" style="height:' + hh + '%; background:' + accent + '; opacity:' + (isT ? 1 : 0.45) + ';"></div>';
    });
    html += '</div>';
    html += '</div>';
  });

  html += '</div>';
  return html;
}

// ============== NAV ==============
function renderNav() {
  return '<div class="nav"><div class="nav-inner">'
    + '<button class="nav-btn ' + (state.view === 'home' ? 'active' : '') + '" onclick="goHome()">' + svgIc('home', 18) + '<span>Home</span></button>'
    + '<button class="nav-btn ' + (state.view === 'progress' ? 'active' : '') + '" onclick="goProgress()">' + svgIc('chart', 18) + '<span>Ledger</span></button>'
    + '</div></div>';
}

// ============== MODAL ==============
function renderModal() {
  if (!state.modal) return '';
  const sec = SECTIONS[state.activeSection];

  if (state.modal === 'addTask') {
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div class="modal-eyebrow">' + sec.name + '</div>'
      + '<div class="modal-title">A new <span class="italic">task</span></div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('edit', 10) + ' Description</div>'
      + '<input id="task-text" type="text" placeholder="What is to be done?" />'
      + '</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('clock', 10) + ' Reminder &middot; optional, leave blank</div>'
      + '<input id="task-time" type="time" />'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'
      + '<button class="btn-submit" onclick="submitTask()">Add</button>'
      + '</div></div></div>';
  }

  if (state.modal === 'addTemplate') {
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div class="modal-eyebrow">' + sec.name + ' &middot; Template</div>'
      + '<div class="modal-title">A recurring <span class="italic">practice</span></div>'
      + '<div class="modal-desc">Templates can be loaded into any day with one tap.</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('edit', 10) + ' Description</div>'
      + '<input id="tpl-text" type="text" placeholder="A practice to repeat" />'
      + '</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('clock', 10) + ' Default reminder</div>'
      + '<input id="tpl-time" type="time" />'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'
      + '<button class="btn-submit" onclick="submitTemplate()">Save</button>'
      + '</div></div></div>';
  }

  if (state.modal === 'templates') {
    const list = state.templates[state.activeSection] || [];
    const hasSamples = list.some(t => t.sample);
    let inner = '';
    if (hasSamples) {
      inner += '<div class="sample-banner"><span class="sample-banner-tag">Sample Templates</span>These are starter templates &mdash; edit or remove freely.</div>';
    }
    if (list.length === 0) {
      inner += '<div class="empty-state"><div class="empty-quote">No templates yet.</div></div>';
    } else {
      inner += '<div class="tpl-list">';
      list.forEach(t => {
        inner += '<div class="tpl-item">';
        inner += '<div class="tpl-bar"></div>';
        inner += '<div class="tpl-body">';
        inner += '<div class="tpl-text">' + esc(t.text) + '</div>';
        if (t.time) inner += '<div class="tpl-time">' + svgIc('clock', 8) + ' ' + t.time + '</div>';
        inner += '</div>';
        inner += '<button class="tpl-add-btn" onclick="addTemplateToToday(\'' + t.id + '\')">+ Day</button>';
        inner += '<button class="task-delete" onclick="openEditTemplate(\'' + t.id + '\')">' + svgIc('edit', 13) + '</button>';
        inner += '<button class="task-delete" onclick="deleteTemplate(\'' + t.id + '\')">' + svgIc('trash', 13) + '</button>';
        inner += '</div>';
      });
      inner += '</div>';
      inner += '<button class="btn-submit" style="width: 100%;" onclick="loadAllTemplates()">Load all into today</button>';
    }
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;">'
      + '<div>'
      + '<div class="modal-eyebrow">' + sec.name + '</div>'
      + '<div class="modal-title">Templates</div>'
      + '</div>'
      + '<button class="tpl-add-btn" onclick="state.modal=\'addTemplate\';render();">+ New</button>'
      + '</div>'
      + inner
      + '</div></div>';
  }

  if (state.modal === 'editTemplate') {
    const tpl = (state.templates[state.activeSection] || []).find(t => t.id === state.modalEditId) || { text: '', time: '' };
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div class="modal-eyebrow">' + sec.name + ' &middot; Edit Template</div>'
      + '<div class="modal-title">Edit <span class="italic">template</span></div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('edit', 10) + ' Description</div>'
      + '<input id="etpl-text" type="text" value="' + esc(tpl.text) + '" />'
      + '</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('clock', 10) + ' Reminder &middot; optional, leave blank, leave blank for none</div>'
      + '<input id="etpl-time" type="time" value="' + (tpl.time || '') + '" />'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn-cancel" onclick="state.modal=\'templates\';state.modalEditId=null;render();">Back</button>'
      + '<button class="btn-submit" onclick="submitEditTemplate()">Save</button>'
      + '</div></div></div>';
  }

  if (state.modal === 'editHabit') {
    const hab = (state.habits[state.activeSection] || []).find(h => h.id === state.modalEditId) || { text: '' };
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div class="modal-eyebrow">' + sec.name + ' &middot; Edit Habit</div>'
      + '<div class="modal-title">Edit <span class="italic">habit</span></div>'
      + '<div class="modal-desc">Editing only changes the name. Your streak and history stay intact.</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('edit', 10) + ' The practice</div>'
      + '<input id="ehabit-text" type="text" value="' + esc(hab.text) + '" />'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'
      + '<button class="btn-submit" onclick="submitEditHabit()">Save</button>'
      + '</div></div></div>';
  }

  if (state.modal === 'addHabit') {
    return '<div class="modal-overlay fade-in" onclick="maybeClose(event)">'
      + '<div class="modal">'
      + '<div class="modal-grip"></div>' + '<button class="modal-close" onclick="closeModal()">' + svgIc('x', 16) + '</button>'
      + '<div class="modal-eyebrow">' + sec.name + ' &middot; Habit</div>'
      + '<div class="modal-title">A daily <span class="italic">practice</span></div>'
      + '<div class="modal-desc">Tracked from 27 May 2026 onward, one day at a time.</div>'
      + '<div class="modal-field">'
      + '<div class="field-label">' + svgIc('edit', 10) + ' The practice</div>'
      + '<input id="habit-text" type="text" placeholder="To be cultivated daily" />'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'
      + '<button class="btn-submit" onclick="submitHabit()">Begin</button>'
      + '</div></div></div>';
  }
  return '';
}

function renderReminders() {
  if (state.reminders.length === 0) return '';
  let html = '<div class="reminder-stack">';
  state.reminders.forEach(r => {
    const sec = SECTIONS[r.section];
    html += '<div class="reminder slide-down">';
    html += '<div class="reminder-icon">' + svgIc('bell', 16) + '</div>';
    html += '<div style="flex:1;min-width:0;">';
    html += '<div class="reminder-meta">' + sec.name + ' &middot; ' + r.time + '</div>';
    html += '<div class="reminder-msg">' + esc(r.text) + '</div>';
    html += '</div>';
    html += '<button class="reminder-x" onclick="dismissReminder(\'' + r.id + '\')">' + svgIc('x', 14) + '</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function render() {
  const app = document.getElementById('app');
  let body = '';
  if (state.view === 'home') body = renderHome();
  else if (state.view === 'section') body = renderSection();
  else if (state.view === 'progress') body = renderProgress();
  app.innerHTML = body + renderNav() + renderModal() + renderReminders();
  fixSvgs();
}

// Handlers
window.goHome = () => { state.view = 'home'; state.modal = null; render(); };
window.goProgress = () => { state.view = 'progress'; state.modal = null; render(); };
window.goSection = (k) => { state.activeSection = k; state.view = 'section'; state.sectionTab = 'tasks'; state.modal = null; render(); };
window.setTab = (t) => { state.sectionTab = t; render(); };
window.openModal = (m) => { state.modal = m; render(); };
window.closeModal = () => { state.modal = null; render(); };
window.maybeClose = (e) => { if (e.target === e.currentTarget) { state.modal = null; render(); } };
window.toggleTask = toggleTask;
window.deleteTask = deleteTask;
window.deleteTemplate = deleteTemplate;
window.addTemplateToToday = addTemplateToToday;
window.loadAllTemplates = loadAllTemplates;
window.deleteHabit = deleteHabit;
window.openEditTemplate = (id) => { state.modalEditId = id; state.modal = 'editTemplate'; render(); };
window.openEditHabit = (id) => { state.modalEditId = id; state.modal = 'editHabit'; render(); };
window.submitEditTemplate = () => {
  const text = document.getElementById('etpl-text').value;
  const time = document.getElementById('etpl-time').value;
  editTemplate(state.modalEditId, text, time);
  state.modal = 'templates'; state.modalEditId = null; render();
};
window.submitEditHabit = () => {
  const text = document.getElementById('ehabit-text').value;
  editHabit(state.modalEditId, text);
  state.modal = null; state.modalEditId = null; render();
};
window.toggleHabit = toggleHabit;
window.shiftWeek = (n) => { state.habitWeekOffset = Math.min(0, state.habitWeekOffset + n); render(); };
window.dismissReminder = (id) => { state.reminders = state.reminders.filter(r => r.id !== id); render(); };
window.submitTask = () => {
  const text = document.getElementById('task-text').value;
  const time = document.getElementById('task-time').value;
  state.modal = null; addTask(text, time);
};
window.submitTemplate = () => {
  const text = document.getElementById('tpl-text').value;
  const time = document.getElementById('tpl-time').value;
  state.modal = null; addTemplate(text, time);
};
window.submitHabit = () => {
  const text = document.getElementById('habit-text').value;
  state.modal = null; addHabit(text);
};
window.state = state;

setInterval(() => {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const nowStr = hh + ':' + mm;
  const today = todayKey();
  const tt = state.tasks[today] || {};
  let changed = false;
  Object.entries(tt).forEach(([sec, list]) => {
    (list || []).forEach(t => {
      if (t.time === nowStr && !t.done && !t.reminded) {
        if (!state.reminders.find(r => r.id === t.id)) {
          state.reminders.push(Object.assign({}, t, { section: sec }));
        }
        t.reminded = true; changed = true;
      }
    });
  });
  if (changed) { save(); render(); }
}, 30000);

try { render(); }
catch (err) {
  document.getElementById('app').innerHTML = '<div style="padding:24px;color:#ff8a65;font-family:monospace;font-size:11px;"><div style="font-size:14px;margin-bottom:12px;">App error</div><pre style="white-space:pre-wrap;word-break:break-word;background:#141d33;padding:16px;border:1px solid #ff8a65;border-radius:6px;">' + (err.message || err) + '\n\n' + (err.stack || '') + '</pre></div>';
}
</script>
</body>
</html>
